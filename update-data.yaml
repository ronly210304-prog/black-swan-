name: Update Terminal Data

on:
  schedule:
    - cron: '*/15 * * * *'   # 15분마다 자동 실행
  workflow_dispatch:          # "Run workflow" 버튼으로 수동 실행도 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 데이터 수집
        run: python fetch_data.py

      - name: data.json 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "auto: 데이터 갱신"
          git push
